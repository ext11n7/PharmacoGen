[build]
  publish = "web"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/investigate"
  to = "/.netlify/functions/investigate"
  status = 200

[[redirects]]
  from = "/api/mcp/dossier"
  to = "/.netlify/functions/mcp-dossier"
  status = 200

[[redirects]]
  from = "/api/mcp/catalog"
  to = "/.netlify/functions/mcp-catalog"
  status = 200

[[redirects]]
  from = "/api/mcp/call"
  to = "/.netlify/functions/mcp-call"
  status = 200

[[redirects]]
  from = "/api/mcp/check"
  to = "/.netlify/functions/mcp-call"
  status = 200

[[redirects]]
  from = "/api/analysis"
  to = "/.netlify/functions/analysis"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
